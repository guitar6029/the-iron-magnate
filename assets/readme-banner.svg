<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#grain)"/>
<rect x="13" y="13" width="1174" height="314" rx="3" fill="none" stroke="#8f6738" stroke-width="2"/>
<rect x="22" y="22" width="1156" height="296" rx="2" fill="none" stroke="#b78c54" stroke-width=".8"/>
<use href="#corner"/><use href="#corner" transform="translate(1200 0) scale(-1 1)"/><use href="#corner" transform="translate(0 340) scale(1 -1)"/><use href="#corner" transform="translate(1200 340) scale(-1 -1)"/>
<path d="M295 103 H490 M710 103 H905 M280 261 H510 M690 261 H920" stroke="#91673b" stroke-width="1.5"/>
<use href="#gear" transform="translate(600 102) scale(.68)"/>
<text x="600" y="201" text-anchor="middle" fill="url(#gold)" stroke="#362417" stroke-width="1" paint-order="stroke" font-family="Georgia, 'Times New Roman', serif" font-size="65" font-weight="bold" letter-spacing="5">THE IRON MAGNATE</text>
<text x="600" y="243" text-anchor="middle" fill="#dbbe89" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" letter-spacing="3">A Victorian Industrial Tycoon Simulator</text>
<text x="600" y="289" text-anchor="middle" fill="#a58355" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="5">FORTUNE IS FORGED</text>
</svg>